<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- PWA / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e6b3a" />
    <meta name="application-name" content="Profe-EFI" />

    <!-- iOS (por si lo abre alguien con iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Profe-EFI" />

    <!-- SEO básico -->
    <meta name="description" content="Planifica sesiones de Educación Física alineadas al MINEDUC, registra el progreso de tus estudiantes y dirige tu clase desde el celular." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

    <title>Profe-EFI</title>

    <style>
      /* Evita flash blanco en carga */
      html, body, #root {
        margin: 0; padding: 0;
        background: #0f1117;
        min-height: 100vh;
        /* Safe area para notch/punch-hole en Xiaomi */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* Spinner de carga inicial */
      #splash {
        position: fixed; inset: 0;
        background: #0f1117;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; gap: 16px;
        transition: opacity 0.4s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 64px; height: 64px;
        background: #1e6b3a;
        border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px;
      }
      .splash-name {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px; font-weight: 700;
        color: white; letter-spacing: -0.5px;
      }
      .splash-sub { font-family: 'Inter', sans-serif; font-size: 13px; color: #4ade80; }
      .splash-spinner {
        width: 24px; height: 24px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-logo">🏃</div>
      <div class="splash-name">Profe-EFI</div>
      <div class="splash-sub">del aula a la cancha</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Ocultar splash cuando React monte
      window.__hideSplash = () => {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(()=>s.remove(), 400); }
      };
    </script>
  </body>
</html>
